<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decodificador</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <p class="etiqueta">Exercício de front-end</p>
    <h1>Decodificador</h1>
    <p class="intro">Troca as vogais por um código e desfaz essa troca. Use letras minúsculas, sem acento.</p>

    <label for="entrada">Texto</label>
    <textarea id="entrada" rows="6" placeholder="digite o texto aqui"></textarea>
    <p id="aviso" role="status"></p>

    <div class="acoes">
      <button id="criptografar" type="button">Criptografar</button>
      <button id="descriptografar" type="button">Descriptografar</button>
    </div>

    <label for="saida">Resultado</label>
    <textarea id="saida" rows="6" readonly placeholder="o resultado aparece aqui"></textarea>
    <button id="copiar" type="button">Copiar resultado</button>
  </main>
  <footer>Reijane Dantas. Exercício de front-end, 2024.</footer>
  <script src="script.js"></script>
</body>
</html>
